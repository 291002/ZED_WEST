<!-- Cinematic introduction -->
<section id="intro" class="intro" aria-label="ZED West introduction">
  <div class="intro-frame">
    <video id="introVideo" class="intro-video" src="assets/zedwest-intro.mp4" poster="assets/zedwest-intro-poster.jpg" muted playsinline preload="auto"></video>
  </div>
  <div class="intro-shade"></div>
  <div class="intro-title">
    <span class="intro-kicker">Ora Developers · Sheikh Zayed</span>
    <h1>ZED WEST</h1>
    <span class="intro-sub">Smart Compound Command Center</span>
  </div>
  <div class="intro-bar"><i id="introProg"></i></div>
  <button id="introPlay" class="intro-btn intro-play" hidden><svg><use href="#i-play"/></svg>Play introduction</button>
  <button id="introSkip" class="intro-btn intro-skip">Enter dashboard<svg><use href="#i-right"/></svg></button>
</section>

<!-- Application shell -->
<div id="app" class="app" aria-hidden="true">
  <nav class="rail" aria-label="Quick actions">
    <div class="rail-logo" title="ZED West">ZW</div>
    <button class="rb" data-act="alerts" title="Alerts & notifications"><svg><use href="#i-bell"/></svg><b class="rb-badge" id="alertCount"></b></button>
    <button class="rb" data-act="insights" title="Executive intelligence"><svg><use href="#i-spark"/></svg></button>
    <button class="rb" data-act="tab:reports" title="Reports & exports"><svg><use href="#i-report"/></svg></button>
    <button class="rb" data-act="sources" title="Data sources & integrations"><svg><use href="#i-plug"/></svg></button>
    <span class="rail-gap"></span>
    <button class="rb" data-act="replay" title="Replay introduction"><svg><use href="#i-replay"/></svg></button>
    <button class="rb" data-act="present" title="Presentation mode (P)"><svg><use href="#i-expand"/></svg></button>
    <button class="rb" data-act="theme" title="Switch Daylight / Evening theme"><svg class="ic-day"><use href="#i-moon"/></svg><svg class="ic-night"><use href="#i-sun"/></svg></button>
  </nav>

  <div class="main-col">
    <header class="hdr">
      <div class="brand">
        <h1>ZED WEST</h1>
        <p>Smart Compound Command Center <span>· Ora Developers</span></p>
      </div>
      <div class="hdr-right">
        <span class="chip-demo" id="modeChip" title="All figures on this dashboard are simulated demonstration data">Demo data</span>
        <div class="filters" role="group" aria-label="Filters">
          <label class="fsel"><svg><use href="#i-calendar"/></svg><select id="fMonth" aria-label="Reporting month"></select></label>
          <label class="fsel"><svg><use href="#i-map"/></svg><select id="fZone" aria-label="Zone"></select></label>
          <label class="fsel"><svg><use href="#i-building"/></svg><select id="fBld" aria-label="Building"></select></label>
          <button class="fclear" id="fClear" hidden>Clear</button>
        </div>
        <div class="clock" id="clock"></div>
      </div>
    </header>

    <div class="tabs-wrap">
      <div class="tabs" role="tablist" id="tabs"></div>
    </div>

    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>

<div id="present" class="present-bar" hidden>
  <i class="pb-prog"><b id="pbFill"></b></i>
  <button data-act="pprev" title="Previous tab (←)"><svg><use href="#i-left"/></svg></button>
  <button data-act="ppause" id="pbPause" title="Pause / resume (Space)"><svg><use href="#i-pause"/></svg></button>
  <button data-act="pnext" title="Next tab (→)"><svg><use href="#i-right"/></svg></button>
  <span id="pbLabel"></span>
  <button data-act="present" title="Exit presentation (Esc)"><svg><use href="#i-x"/></svg></button>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drTitle">
  <header class="dr-h"><div><small id="drKicker"></small><h2 id="drTitle"></h2></div><button class="dr-x" data-act="close" aria-label="Close"><svg><use href="#i-x"/></svg></button></header>
  <div class="dr-b" id="drBody"></div>
</aside>
<div id="pop" class="pop" hidden></div>
<div id="tip" class="tip" hidden role="tooltip"></div>
<div id="toast" class="toast" hidden></div>
<iframe id="printFrame" title="Report print frame" style="position:fixed;width:0;height:0;border:0;right:0;bottom:0"></iframe>
